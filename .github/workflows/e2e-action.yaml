name: Jenkins Build Handler

on:
  repository_dispatch:
    types: [jenkins_build_complete]
  workflow_dispatch:

jobs:
  AssumeRoleAndCallIdentity:
    runs-on:  [self-hosted, e2e]
    environment: E2E_LAB_ACTION
    steps:
      - name: Debug - Job started
        run: |
          echo "E2E test job started successfully"
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }}"
          whoami
          pwd

      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ vars.IAM_AWS_ROLE }}
          role-session-name: GitHubActiionUser
          aws-region: ${{ vars.IAM_AWS_REGION }}

      - name: Sts GetCallerIdentity
        run: |
          aws s3 ls

      - name: Upload OS release info
        uses: actions/upload-artifact@v4
        with:
          name: os-release
          path: /etc/os-release
