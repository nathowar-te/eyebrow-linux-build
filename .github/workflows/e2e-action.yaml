name: Jenkins Build Handler

on:
  repository_dispatch:
    types: [jenkins_build_complete]
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: [self-hosted, e2e]
    steps:
      - name: Debug - Job started
        run: |
          echo "E2E test job started successfully"
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }}"
          whoami
          pwd

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload OS release info
        uses: actions/upload-artifact@v4
        with:
          name: os-release
          path: /etc/os-release