name: Jenkins Build Handler

on:
  repository_dispatch:
    types: [jenkins_build_complete]
  workflow_dispatch:

env:
  IAM_AWS_ROLE: arn:aws:iam::905418489191:role/github-actions-endpoint-s3-role
  IAM_AWS_REGION: eu-central-1

jobs:
  AssumeRoleAndCallIdentity:
    runs-on:  [self-hosted, e2e]
    environment: E2E_TEST
    steps:
      - name: Debug - Job started
        run: |
          echo "E2E test job started successfully"
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }}"
          whoami
          pwd

      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: arn:aws:iam::905418489191:role/github-actions-endpoint-s3-role
          role-session-name: GitHubActionUser
          aws-region: ${{ env.IAM_AWS_REGION }}

      - name: List S3 buckets
        run: |
          aws s3 ls

      - name: Upload OS release info
        uses: actions/upload-artifact@v4
        with:
          name: os-release
          path: /etc/os-release
